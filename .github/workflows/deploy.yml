# Builds the static export and publishes it to GitHub Pages on every push,
# by force-pushing out/ to the gh-pages branch (which GitHub auto-serves).
# Live site: https://prestonaguinaga.github.io/Agromex-Direct/
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/construction-quote-tool-rdnb0p]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Agromex-Direct
      # Without this, Pages runs Jekyll and drops the _next/ directory.
      - run: touch out/.nojekyll
      - name: Push out/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
